<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mrGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="50%" stop-color="#1a0530"/>
      <stop offset="100%" stop-color="#2a0a40"/>
    </linearGradient>
    <radialGradient id="mrBurst" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#5a14a8"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="mrAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4557"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4aa8ff"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="800" height="500" fill="url(#mrGrad)"/>

  <!-- energy burst backdrop -->
  <circle cx="400" cy="250" r="280" fill="url(#mrBurst)" opacity="0.45"/>
  <circle cx="400" cy="250" r="180" fill="url(#mrBurst)" opacity="0.35"/>

  <!-- radial lines (comic-style burst) -->
  <g transform="translate(400 250)" stroke="#a855f7" stroke-width="2" opacity="0.4">
    <line x1="0" y1="-240" x2="0" y2="-320"/>
    <line x1="0" y1="240" x2="0" y2="320"/>
    <line x1="-240" y1="0" x2="-320" y2="0"/>
    <line x1="240" y1="0" x2="320" y2="0"/>
    <line x1="170" y1="-170" x2="226" y2="-226"/>
    <line x1="-170" y1="-170" x2="-226" y2="-226"/>
    <line x1="170" y1="170" x2="226" y2="226"/>
    <line x1="-170" y1="170" x2="-226" y2="226"/>
    <line x1="120" y1="-208" x2="160" y2="-277"/>
    <line x1="-120" y1="-208" x2="-160" y2="-277"/>
    <line x1="208" y1="-120" x2="277" y2="-160"/>
    <line x1="-208" y1="-120" x2="-277" y2="-160"/>
  </g>

  <!-- halftone dot pattern -->
  <g fill="#a855f7" opacity="0.25">
    <circle cx="100" cy="80"  r="3"/>
    <circle cx="140" cy="80"  r="2"/>
    <circle cx="180" cy="80"  r="1"/>
    <circle cx="100" cy="120" r="2"/>
    <circle cx="140" cy="120" r="1"/>
    <circle cx="620" cy="80"  r="1"/>
    <circle cx="660" cy="80"  r="2"/>
    <circle cx="700" cy="80"  r="3"/>
    <circle cx="660" cy="120" r="1"/>
    <circle cx="700" cy="120" r="2"/>
    <circle cx="100" cy="420" r="1"/>
    <circle cx="140" cy="420" r="2"/>
    <circle cx="180" cy="420" r="3"/>
    <circle cx="620" cy="420" r="3"/>
    <circle cx="660" cy="420" r="2"/>
    <circle cx="700" cy="420" r="1"/>
  </g>

  <!-- central diamond emblem -->
  <g transform="translate(400 250)">
    <polygon points="0,-90 90,0 0,90 -90,0" fill="#0a0712" stroke="url(#mrAccent)" stroke-width="3"/>
    <polygon points="0,-60 60,0 0,60 -60,0" fill="none" stroke="url(#mrAccent)" stroke-width="2" opacity="0.8"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#a855f7" opacity="0.5"/>
    <text x="0" y="10" font-family="Space Grotesk, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">MR</text>
  </g>

  <!-- speed streaks -->
  <g stroke="#4aa8ff" stroke-width="1.5" opacity="0.6">
    <line x1="60" y1="200" x2="160" y2="200"/>
    <line x1="40" y1="230" x2="140" y2="230"/>
    <line x1="70" y1="260" x2="170" y2="260"/>
    <line x1="640" y1="200" x2="740" y2="200"/>
    <line x1="660" y1="230" x2="760" y2="230"/>
    <line x1="630" y1="260" x2="730" y2="260"/>
  </g>
  <g stroke="#ff4557" stroke-width="1.5" opacity="0.5">
    <line x1="80" y1="300" x2="180" y2="300"/>
    <line x1="620" y1="300" x2="720" y2="300"/>
  </g>

  <!-- corner sparkles -->
  <g fill="#fff">
    <circle cx="80" cy="60" r="1.5"/>
    <circle cx="720" cy="60" r="1.5"/>
    <circle cx="80" cy="440" r="1"/>
    <circle cx="720" cy="440" r="1"/>
    <circle cx="400" cy="40" r="1.5"/>
    <circle cx="400" cy="460" r="1"/>
  </g>

  <!-- text watermark -->
  <text x="40" y="470" font-family="Space Grotesk, sans-serif" font-size="62" font-weight="900" fill="#ffffff" fill-opacity="0.06" letter-spacing="-3">MARVEL RIVALS</text>
</svg>
