# The clipped licence server on Cloudflare Workers.
# Deploy: `npx wrangler deploy` here, or push to main (.github/workflows/clipped-api.yml).
# Secrets and settings live in the Cloudflare dashboard (Workers → clipped-api →
# Settings → Variables and Secrets); see README.md. keep_vars stops a deploy from
# wiping the ones set there.
name = "clipped-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = true

[observability]
enabled = true
